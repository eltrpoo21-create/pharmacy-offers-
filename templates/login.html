{% extends "base.html" %}
{% block title %}تسجيل العميل - صيدليتك للعروض{% endblock %}
{% block content %}
<section class="form-card narrow">
  <span class="eyebrow">مرحباً بك</span>
  <h1>بيانات العميل</h1>
  <p class="muted">اكتب اسمك ورقم هاتفك وعنوانك بالتفصيل لتفعيل حسابك والبدء في طلب العروض فوراً.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>الاسم بالكامل<input name="name" required minlength="2" maxlength="100" placeholder="مثال: أحمد محمد"></label>
    <label>رقم الهاتف<input name="phone" required inputmode="tel" maxlength="15" placeholder="01xxxxxxxxx"></label>
    <label>العنوان بالتفصيل<input name="address" required minlength="4" maxlength="250" placeholder="مثال: شارع المحطة - بجوار مسجد..."></label>
    <button class="btn full" type="submit">تسجيل ودخول فوري</button>
  </form>
  <p class="small-note">ملاحظة: يتم تفعيل حسابك تلقائياً بمجرد التسجيل لسهولة الطلب والتوصيل.</p>
</section>
{% endblock %}
